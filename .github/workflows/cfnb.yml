name: Cloudflare IP Optimal

on:
  schedule:
    - cron: '*/30 * * * *' # 每隔 30 分钟自动运行一次
  workflow_dispatch: # 允许你在网页上一键手动触发

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp brotlicffi

      - name: Run CFNB script
        run: python main.py

      - name: Commit and push updated ip.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.node.red"
          git add ip.txt
          git commit -m "Auto-update optimal ip.txt by GitHub Actions" || exit 0
          git push
